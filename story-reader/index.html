<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>午夜图书馆</title>
  <style>
    body {
      font-family: "Microsoft YaHei", sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      line-height: 1.8;
      background: #0f172a;
      color: #e2e8f0;
    }
    #story-text { font-size: 20px; min-height: 120px; }
    button {
      display: block;
      margin: 10px 0;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background: #1e3a5f;
      color: white;
      border: none;
      border-radius: 6px;
    }
    button:hover { background: #2c5282; }
  </style>
</head>
<body>
  <h1>📖 午夜图书馆</h1>
  <img id="story-image" alt="场景图片" style="display:none; max-width:100%; border-radius:8px; margin-bottom:16px;">
  <p id="story-text"></p>
  <div id="choices"></div>

  <!-- 故事数据（先加载） -->
  <script src="story.js"></script>
  <!-- 阅读器逻辑（后加载） -->
  <script src="script.js"></script>
</body>
</html>
